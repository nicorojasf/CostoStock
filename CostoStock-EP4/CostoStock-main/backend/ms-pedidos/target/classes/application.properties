spring.application.name=ms-pedidos
server.port=8083

# Base de datos por defecto: H2 en archivo. Perfil "mysql" para MySQL.
spring.datasource.url=jdbc:h2:file:./data/pedidos;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# URL del microservicio de productos (para validar precios y descontar stock).
costostock.productos.url=${PRODUCTOS_URL:http://localhost:8082}

springdoc.swagger-ui.path=/swagger-ui.html
