spring.application.name=ms-productos
server.port=8082

# Base de datos por defecto: H2 en archivo. Perfil "mysql" para MySQL.
spring.datasource.url=jdbc:h2:file:./data/productos;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Carga el catálogo inicial si la tabla está vacía.
costostock.seed=true

springdoc.swagger-ui.path=/swagger-ui.html

# Firma de los tokens de sesión (debe ser igual en los tres microservicios)
costostock.seguridad.secreto=${COSTOSTOCK_SECRETO:costostock-dsy1105-clave-compartida-cambiar-en-produccion}
costostock.seguridad.horas=168
