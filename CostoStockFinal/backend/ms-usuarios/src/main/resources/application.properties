spring.application.name=ms-usuarios
server.port=8081

# Base de datos por defecto: H2 en archivo (persiste entre reinicios, no requiere instalación).
# Para usar MySQL ejecuta con el perfil "mysql" (ver application-mysql.properties).
spring.datasource.url=jdbc:h2:file:./data/usuarios;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Documentación interactiva: http://localhost:8081/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html

# Firma de los tokens de sesión (debe ser igual en los tres microservicios)
costostock.seguridad.secreto=${COSTOSTOCK_SECRETO:costostock-dsy1105-clave-compartida-cambiar-en-produccion}
costostock.seguridad.horas=168
